[package]
name = "plume"
version = "0.1.0"
edition = "2024"
description = "A word processor that opens and saves Word files, with Claude in a side panel"
license = "MIT"
repository = "https://github.com/GoldenSheeeep/plume"

[[bin]]
name = "docs"
path = "src/main.rs"

[dependencies]
atelier = { git = "https://github.com/GoldenSheeeep/atelier", rev = "1bfafed9ec64648dd178f5b77dc4e047fbf5dba6" }
eframe = { version = "0.37", default-features = false, features = ["glow", "wayland", "x11", "default_fonts"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
docx-rs = "0.4.22"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
